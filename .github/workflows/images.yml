name: Publish images

# Builds the server images (admin panel and API) on GitHub and stores them in the repository's container registry, so a small
# server can download them instead of building them (see docs/DEPLOYMENT.md, "Small servers").
#   push a v* tag   -> ghcr.io/<owner>/<repo>/admin:<version> and /api:<version>  (and :latest)
#   "Run workflow"  -> the same for the branch you pick (tagged with its short commit id)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: admin
            context: admin-web
          - image: api
            context: backend
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Names and tags
        id: meta
        run: |
          repo="$(echo "${GITHUB_REPOSITORY}" | tr 'A-Z' 'a-z')"
          name="ghcr.io/${repo}/${{ matrix.image }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "tags=${name}:${version},${name}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${name}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
