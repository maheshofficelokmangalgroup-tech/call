# The employee web app on its own: one container (the web server and the built app).
#
#   cp .env.example .env            # then set API_UPSTREAM (and SITE_ADDRESS for a domain)
#   docker compose up -d --build
#   docker compose logs -f
#
# To run it inside the project's own production stack instead, see DEPLOY.md (option 1).
name: employee-web

services:
  employee-web:
    build:
      context: .
      args:
        VITE_APP_VERSION: ${APP_VERSION:-1.0.0}
    image: ${WEB_IMAGE:-calling-employee-web:local}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      API_UPSTREAM: ${API_UPSTREAM:?set API_UPSTREAM in .env - where the API is, e.g. https://calling.example.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.invalid}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data # the HTTPS certificate
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
