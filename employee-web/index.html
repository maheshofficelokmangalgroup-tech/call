<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0C831F" />
    <!-- the app has a light design only: do not let a phone's forced dark mode invert it -->
    <meta name="color-scheme" content="light" />
    <meta name="description" content="The Employee Calling app in your browser: today's contacts, calls, outcomes and callbacks." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- the icon an iPhone / iPad puts on the home screen ("Add to Home Screen"); Android takes its icons from the manifest -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Calling" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Employee Calling</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>The Employee Calling web app needs JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
