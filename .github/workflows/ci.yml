name: CI

# Checks on every push and pull request: the API (SQLite and MySQL), the app, the admin panel (types, lint, unit tests, a real
# build, a full browser test run against a real API) and the production Docker stack.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run the API tests
        run: python -m pytest

  backend-mysql:
    name: Backend tests (MySQL 8.4, as in production)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: calling_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/calling_test?charset=utf8mb4
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run the API tests on MySQL (the reports use SQL that differs between databases)
        run: python -m pytest

  mobile:
    name: App checks (types, lint, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --max-warnings=0

      - name: Unit tests
        run: npm test -- --ci

  admin-web:
    name: Admin panel (types, lint, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (the panel, its tests and its browser tests)
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Unit tests
        run: npm test

      - name: Production build (also compiles and prerenders every page)
        run: npm run build
        env:
          BACKEND_URL: http://127.0.0.1:8000

  api-contract:
    name: Panel and API agree (generated types are current)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Describe the API
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m scripts.export_openapi "$RUNNER_TEMP/openapi.json"

      - name: Generate the panel's types from it and compare
        working-directory: admin-web
        run: |
          npm ci
          npx openapi-typescript "$RUNNER_TEMP/openapi.json" -o "$RUNNER_TEMP/api-types.ts"
          if ! diff -u src/lib/api-types.ts "$RUNNER_TEMP/api-types.ts"; then
            echo "::error::The API changed but admin-web/src/lib/api-types.ts was not regenerated. Run: cd backend && python -m scripts.export_openapi ../admin-web/openapi.json && cd ../admin-web && npm run gen:api -- (see package.json)"
            exit 1
          fi

  e2e:
    name: Admin panel in a real browser (against a real API)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_BASE_URL: http://127.0.0.1:3100
      E2E_BACKEND_URL: http://127.0.0.1:8002
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Start the API with demo data (a month of calls, recordings, people on a call right now)
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/e2e.db
          LOCAL_STORAGE_PATH: ${{ runner.temp }}/e2e-storage
          IMPORT_STORAGE_PATH: ${{ runner.temp }}/e2e-imports
          REDIS_URL: ''
          BCRYPT_ROUNDS: '6'
          LOG_LEVEL: WARNING
          RATE_LIMIT_LOGIN_PER_IP: '1000'
        run: |
          python -m pip install -r requirements.txt
          python -m scripts.bootstrap
          python -m scripts.seed_demo --employees 10 --contacts 600
          python -m scripts.seed_history --rename
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8002 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8002/health && break || sleep 1; done

      - name: Install the panel and a browser
        working-directory: admin-web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build and start the panel
        working-directory: admin-web
        env:
          BACKEND_URL: http://127.0.0.1:8002
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm run build
          PORT=3100 HOSTNAME=127.0.0.1 COOKIE_SECURE=false nohup node scripts/start-standalone.mjs > "$RUNNER_TEMP/panel.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3100/api/health && break || sleep 1; done

      - name: Run the browser tests (desktop and phone)
        working-directory: admin-web
        run: npx playwright test

      - name: Keep the evidence when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            admin-web/playwright-report
            admin-web/test-results
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/panel.log
          retention-days: 7

  docker-stack:
    name: 'Production stack - Docker: HTTPS front door, panel, API, MySQL, Redis'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Shell scripts are valid
        run: |
          for f in deploy/*.sh; do bash -n "$f"; done
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -S warning deploy/*.sh

      - name: Settings for a throw-away stack on plain http
        run: |
          cat > .env.production <<EOF
          SITE_ADDRESS=:80
          PUBLIC_URL=http://localhost
          COOKIE_SECURE=false
          ACME_EMAIL=ci@example.com
          APP_NAME="Employee Calling"
          MYSQL_DATABASE=calling_app
          MYSQL_USER=app
          MYSQL_PASSWORD=ci-mysql-password-0123456789
          MYSQL_ROOT_PASSWORD=ci-mysql-root-0123456789
          APP_TIMEZONE=Asia/Kolkata
          JWT_SECRET=ci-jwt-secret-0123456789-0123456789-0123456789-0123456789
          STORAGE_BACKEND=local
          BOOTSTRAP_ADMIN_EMAIL=admin@ci.example.com
          BOOTSTRAP_ADMIN_PASSWORD=Ci-Admin-Passw0rd
          ADMIN_IMAGE=
          API_IMAGE=
          EOF

      - name: Build and start everything
        run: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

      - name: Wait until it is healthy
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost/health >/dev/null 2>&1 && curl -fsS "http://localhost/api/health?deep=1" >/dev/null 2>&1; then echo healthy; exit 0; fi
            sleep 4
          done
          docker compose -f docker-compose.prod.yml --env-file .env.production ps
          docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail=80
          exit 1

      - name: Use it like a person would
        run: |
          set -euo pipefail
          # the API, as the phones reach it
          curl -fsS http://localhost/health | grep '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost/api/v1/auth/login -H 'content-type: application/json' -d '{"identifier":"x@x.com","password":"wrong-password-1"}')" = 401
          # the documentation pages are off in production
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/docs)" != 200
          # the panel: a signed-out visitor is sent to the sign-in page, and comes back to where they wanted to go
          curl -sI http://localhost/employees | grep -i '^location: .*/login?next=%2Femployees'
          curl -fsS http://localhost/login | grep -qi 'Welcome back'
          # signing in through the panel, and asking for data with the session
          curl -fsS -c jar.txt -X POST http://localhost/api/auth/login -H 'content-type: application/json' -H 'x-requested-with: admin-web' \
            -d '{"identifier":"admin@ci.example.com","password":"Ci-Admin-Passw0rd"}' | grep '"role":"admin"'
          grep -q ec_at jar.txt
          curl -fsS -b jar.txt http://localhost/api/backend/analytics/overview | grep '"totals"'
          curl -fsS -b jar.txt http://localhost/api/backend/settings | grep '"default_daily_target"'
          # security headers of the panel
          curl -sI http://localhost/login | grep -i "content-security-policy"

      - name: Back up and restore, as an operator would
        run: |
          sudo mkdir -p /var/backups/calling
          sudo chown "$USER" /var/backups/calling
          bash deploy/backup.sh
          ls -la /var/backups/calling
          test -n "$(ls /var/backups/calling/db-*.sql.gz)"
          gunzip -c /var/backups/calling/db-*.sql.gz | grep -q 'CREATE TABLE `employees`'

      - name: Logs when something failed
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.production logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml --env-file .env.production down -v
